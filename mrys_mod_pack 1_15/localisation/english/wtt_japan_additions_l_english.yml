l_english:

 #Japan Additions
 JAP_Nuclear_Focus_tt: "If there are no other §YExperimental Facilities§! in §Y[531.GetName]§!, we will gain §G1§! §YNuclear Research Facility§! in §Y[531.GetName]§!."
 JAP_Expand_Industrial_Workforce:0 "Expand the Industrial Workforce"
 JAP_Expand_Industrial_Workforce_desc:0 "A strong industrial base requires skilled workers. By training and mobilizing more laborers, we can increase factory output and ensure our war machine operates at full capacity."
 JAP_Nationalize_Key_Industries:0 "Nationalize Key Industries"
 JAP_Nationalize_Key_Industries_desc:0 "Private industry must serve the needs of the state. By nationalizing critical sectors such as steel, coal, and machinery, we can direct resources toward the war effort without delay."
 JAP_Upgrade_Electrical_Infrastructure:0 "Upgrade Electrical Infrastructure"
 JAP_Upgrade_Electrical_Infrastructure_desc:0 "Modern industry depends on reliable electricity. By expanding power plants and upgrading the grid, we can support the energy demands of our growing war economy."
 JAP_Improve_Resource_Logistics:0 "Improve Resource Logistics"
 JAP_Improve_Resource_Logistics_desc:0 "Efficient transportation of raw materials is essential for sustained production. By upgrading railways, ports, and roads, we can ensure resources reach our factories without interruption."
 JAP_Develop_Tokai_Industrial_Corridor:0 "Develop the Tokai Industrial Corridor"
 JAP_Develop_Tokai_Industrial_Corridor_desc:0 "The Tokai region, with its access to ports and resources, is ripe for industrial development. Building factories here will create a second hub for war production."
 JAP_Build_Kyushu_Industrial_Zone:0 "Build the Kyushu Industrial Zone"
 JAP_Build_Kyushu_Industrial_Zone_desc:0 "The Kyushu region is ideal for industrial expansion. Developing this area will create a powerhouse of war production."
 JAP_Centralize_War_Production:0 "Centralize War Production"
 JAP_Centralize_War_Production_desc:0 "To maximize efficiency, we must centralize control over our factories and resources. By coordinating production under a unified command, we can eliminate waste and prioritize military needs."
 JAP_Establish_Imperial_Munitions_Bureau:0 "Establish the Imperial Munitions Bureau"
 JAP_Establish_Imperial_Munitions_Bureau_desc:0 "A dedicated bureau for munitions production will streamline the development and distribution of weapons. This centralized authority will eliminate bottlenecks and accelerate output."
 JAP_Implement_Total_Industrial_Mobilization:0 "Implement Total Industrial Mobilization"
 JAP_Implement_Total_Industrial_Mobilization_desc:0 "Every factory, every worker, and every resource must be dedicated to the war effort. By implementing total mobilization, we can maximize production and ensure our military lacks for nothing."
 JAP_Establish_National_Defense_Research_Institute:0 "Establish the National Defense Research Institute"
 JAP_Establish_National_Defense_Research_Institute_desc:0 "Innovation is key to maintaining our edge. By creating a dedicated research institute, we can develop new technologies and production methods to support our military-industrial complex."