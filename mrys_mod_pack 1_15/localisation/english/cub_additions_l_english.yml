l_english:

 #Cuba Additions
 CUB_National_Modernization: "Modernizar la Nación"
 CUB_National_Modernization_desc: "The winds of change sweep across Cuba. Under President [ROOT.GetLeader]'s leadership, we must modernize our economy, strengthen our military, and prepare our people for the challenges ahead. A strong Cuba is a Cuba ready to defend its sovereignty and stand tall among the nations of the world." 
 CUB_Pan_American_Solidarity: "Solidaridad Panamericana"
 CUB_Pan_American_Solidarity_desc: "Tyranny threatens not only Europe but the entire world. Cuba cannot stand idly by while our brothers and sisters suffer. By uniting the Caribbean under a common cause, we can forge a brighter future for all. Together, we are stronger."
 CUB_Expeditionary_Forces: "La Legión del Caribe"
 CUB_Expeditionary_Forces_desc: "The time has come to take the fight to the our enemies. Our brave soldiers, trained in the jungles and mountains of our homeland, are ready to prove their mettle on the global stage. The Caribbean Legion will show the world that Cuba is a force to be reckoned with."
 CUB_Post_War_Ambitions: "El Futuro de Cuba"
 CUB_Post_War_Ambitions_desc: "The struggle may be over, but our work is far from finished. Cuba has proven itself on the battlefield; now we must secure our place in the post-war world. Through diplomacy, economic growth, and regional leadership, we will ensure that Cuba's voice is heard loud and clear."